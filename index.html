<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>7 Niveaux · Loan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg:#07090f; --s1:#0e1120; --s2:#151824; --line:#1c2135;
  --fg:#e6eaf5; --mid:#5e6b85; --dim:#2e3650;
  --l1:#e3262b; --l2:#f07c1e; --l3:#f5c518;
  --l4:#b7d334; --l5:#5cc83b; --l6:#22a65a; --l7:#1f7fd1;
  --accent:#e3262b;
  --accent-tint:rgba(227,38,43,.09);
  --accent-border:rgba(227,38,43,.28);
  --num:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Manrope",system-ui,sans-serif;
  --r:12px;
  color-scheme:dark;
}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){
  --bg:#edf0f8;--s1:#fff;--s2:#e4e8f2;--line:#ccd2e0;
  --fg:#0c1023;--mid:#58698a;--dim:#b5bdd0;color-scheme:light;
}}
:root[data-theme=light]{
  --bg:#edf0f8;--s1:#fff;--s2:#e4e8f2;--line:#ccd2e0;
  --fg:#0c1023;--mid:#58698a;--dim:#b5bdd0;color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.6}

/* ── PAGE LAYOUT ── */
.page{display:flex;flex-direction:column;height:100vh}

/* ── TOPBAR ── */
.topbar{
  height:46px;display:flex;align-items:center;gap:14px;
  padding:0 18px;border-bottom:1px solid var(--line);
  flex-shrink:0;
}
.brand{font-family:var(--num);font-weight:900;font-size:17px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-left:auto}
.chip{font-size:10px;font-weight:600;color:var(--mid);padding:2px 9px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.chip strong{color:var(--fg)}

/* ── LEVEL NAV STRIP ── */
.lnav{
  display:grid;grid-template-columns:repeat(7,1fr);
  flex-shrink:0;height:118px;
  border-bottom:3px solid var(--bg);
}
.lb{
  all:unset;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;position:relative;
  transition:filter .15s, transform .12s;
  border-right:2px solid rgba(0,0,0,.22);
  overflow:hidden;
}
.lb:last-child{border-right:none}
.lb:hover{filter:brightness(1.18);transform:scaleY(1.03);z-index:1}
.lb.active{filter:brightness(1.0);transform:scaleY(1.0)}
.lb.active::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:4px;
  background:rgba(255,255,255,.9);
}
.lb.locked{filter:brightness(.38) saturate(.3)}
.lb-num{
  font-family:var(--num);font-weight:900;
  font-size:clamp(38px,5.5vw,68px);line-height:.88;
  color:rgba(0,0,0,.75);
  text-shadow:0 1px 0 rgba(255,255,255,.12);
  transition:color .15s;
}
.lb.active .lb-num{color:rgba(0,0,0,.9)}
.lb-label{
  font-family:var(--num);font-weight:700;font-size:clamp(9px,1.1vw,13px);
  letter-spacing:.14em;text-transform:uppercase;
  color:rgba(0,0,0,.55);margin-top:1px;
}
.lb.active .lb-label{color:rgba(0,0,0,.72)}
.lb-ck{
  position:absolute;top:6px;right:7px;
  font-size:clamp(9px,1vw,12px);font-weight:900;
  color:rgba(0,0,0,.6);
}
.lb-cur{
  position:absolute;top:5px;left:6px;
  font-size:8px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;
  background:rgba(0,0,0,.35);color:rgba(255,255,255,.9);
  padding:1px 5px;border-radius:3px;
}

/* ── CONTENT ── */
.content{
  flex:1;overflow-y:auto;
  padding:24px 28px 36px;
  scrollbar-width:thin;scrollbar-color:var(--line) transparent;
  transition:opacity .12s ease;
}
.content.fading{opacity:0}
@media(max-width:640px){.content{padding:14px 12px 28px}}

/* ── LEVEL HERO ── */
.lv-hero{
  display:grid;grid-template-columns:auto 1fr;
  align-items:end;gap:16px;margin-bottom:18px;
  padding-bottom:18px;border-bottom:1px solid var(--line);
}
.lv-bignum{
  font-family:var(--num);font-weight:900;
  font-size:clamp(72px,9vw,124px);line-height:.82;
  color:var(--accent);flex-shrink:0;
}
.lv-ht{min-width:0}
.lv-tag{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:5px}
.lv-title{font-family:var(--num);font-weight:900;font-size:clamp(24px,3.5vw,48px);text-transform:uppercase;line-height:.95;text-wrap:balance}
.lv-sub{font-size:13px;color:var(--mid);margin-top:6px;line-height:1.45}
.lv-won-badge{
  display:inline-flex;align-items:center;gap:5px;margin-top:7px;
  font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  background:var(--accent);color:#07090f;padding:3px 9px;border-radius:4px;
}

/* ── PHASE NOTE ── */
.ph-note{
  font-size:12px;color:var(--mid);line-height:1.6;
  padding:9px 13px;margin-bottom:18px;
  border-left:3px solid var(--accent);
  border-radius:0 8px 8px 0;
  background:var(--accent-tint);
}

/* ── STATS ── */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:18px}
@media(max-width:860px){.stats{grid-template-columns:repeat(3,1fr)}}
@media(max-width:480px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px}
.stat-v{
  font-family:var(--num);font-weight:900;font-size:clamp(20px,2.2vw,30px);
  line-height:1;font-variant-numeric:tabular-nums;color:var(--accent);
}
.stat-l{font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mid);margin-top:3px}
.stat-s{font-size:10px;color:var(--dim);margin-top:2px}

/* ── MAIN GRID ── */
.mgrid{display:grid;grid-template-columns:1.2fr 1fr;gap:12px;align-items:start}
@media(max-width:820px){.mgrid{grid-template-columns:1fr}}

/* ── SKILL CARD ── */
.skill{
  background:var(--s1);border:2px solid var(--accent);
  border-radius:var(--r);padding:20px 18px;
  display:flex;flex-direction:column;gap:14px;
}
.skill-ey{font-size:9px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.skill-name{font-family:var(--num);font-weight:900;font-size:clamp(34px,4.5vw,54px);line-height:.88;text-transform:uppercase;margin-top:-2px}
.skill-row{display:flex;flex-direction:column;gap:3px}
.skill-dt{font-size:9px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--mid)}
.skill-dd{font-size:13px;line-height:1.55}
.skill-mes{
  border-radius:8px;padding:9px 12px;font-size:12px;line-height:1.5;
  background:var(--accent-tint);border:1px solid var(--accent-border);
}
.skill-mes::before{content:"✓ ";font-weight:900;color:var(--accent)}

/* ── RIGHT COL ── */
.rcol{display:flex;flex-direction:column;gap:9px}
.box{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.box-h{font-size:9px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--mid);margin-bottom:9px}
.cd-n{font-family:var(--num);font-weight:900;font-size:clamp(44px,5.5vw,74px);line-height:1;font-variant-numeric:tabular-nums;color:var(--accent)}
.cd-u{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mid);margin-top:1px}
.cd-d{font-size:11px;color:var(--dim);margin-top:4px}
.grow{list-style:none;display:flex;flex-direction:column;gap:9px}
.gi{display:grid;grid-template-columns:58px 1fr;gap:6px}
.gi-k{font-size:9px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);padding-top:1px}
.gi-v{font-size:12px;line-height:1.5}
.prod-list{list-style:none;display:flex;flex-direction:column;gap:5px}
.prod-item{font-size:12px;line-height:1.45;padding-left:15px;position:relative}
.prod-item::before{content:"→";position:absolute;left:0;font-weight:700;color:var(--accent)}
.fail-p{font-size:12px;color:var(--mid);line-height:1.55}

/* ── WIN BUTTON ── */
.win{
  all:unset;cursor:pointer;display:block;width:100%;
  text-align:center;padding:14px;border-radius:var(--r);
  font-family:var(--num);font-size:17px;font-weight:900;
  letter-spacing:.07em;text-transform:uppercase;
  transition:opacity .15s,transform .1s;
}
.win.todo{background:var(--accent);color:#07090f}
.win.done{background:transparent;color:var(--accent);border:2px solid var(--accent);padding:12px}
.win:hover{opacity:.85}
.win:active{transform:scale(.98)}
.win:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
@keyframes pop{0%,100%{transform:scale(1)}40%{transform:scale(1.05)}70%{transform:scale(.97)}}
.win.popping{animation:pop .3s ease}

/* ── MOBILE NAV ── */
@media(max-width:600px){
  .lnav{height:72px}
  .lb-label{display:none}
  .topbar .chips{display:none}
}
@media(prefers-reduced-motion:reduce){
  .content,.win,.lb{transition:none;animation:none}
}
</style>
</head>
<body>
<div class="page">

  <div class="topbar">
    <span class="brand">7 Niveaux · Loan</span>
    <div class="chips">
      <span class="chip">Départ <strong>11 oct. 2026</strong> · ~2 700 abonnés · record 50K</span>
      <span class="chip">Objectif <strong>1 000 €/mois</strong> fin août 2027</span>
      <span class="chip">Rythme <strong>1 longue/mois · 1 Short/sem.</strong></span>
    </div>
  </div>

  <nav class="lnav" id="lnav" aria-label="Niveaux"></nav>

  <main class="content" id="content" aria-live="polite"></main>

</div>

<script>

var LV = [

     ex:"Écris ta voix off, puis lis-la à voix haute : chaque phrase où tu butes est réécrite. Phrases de moins de 15 mots. Une boucle ouverte toutes les 2 min.",
     mes:"Durée moyenne de visionnage au-dessus de 40 %."},
   grow:[["Vues","Écran de fin + carte vers ta meilleure vidéo dans chaque nouvelle. Un spectateur qui enchaîne 2 vidéos, c'est le signal de recommandation."],
         ["Shorts","Format avant/après de tes plans. Un format reconnaissable qu'on a envie de revoir."],
         ["Abonnés","Un live après chaque sortie : le public des lives est celui qui s'abonne et qui revient."]],
   prod:["4 Shorts découpés dans les rushs de chaque longue","1 vidéo tournée pendant les vacances de Noël"],
   fail:"Les gains sous 70 € restent cumulés et seront versés le mois suivant le passage du seuil. Rien n'est perdu."},
  {hex:"#f5c518", ph:2, name:"La 80K", goal:"80K vues", date:"2027-02-15",
   exploit:"Une vidéo longue à 80 000 vues",
   stats:{vids:[22,4,18], longs:"220K", shorts:"600K", subs:"4 500", eur:"~150 €/mois"},
   skill:{name:"L'escalade",
     why:"La plupart des vidéos perdent leur public entre la minute 5 et 10. Il faut que chaque séquence monte d'un cran par rapport à la précédente.",
     ex:"Avant de monter, écris chaque séquence sur une ligne avec son niveau de tension de 1 à 10. Si un chiffre redescend, tu coupes ou tu déplaces.",

   grow:[["Vues","Une playlist par type de vidéo mise en avant. À cette taille, les vues viennent des vidéos suggérées."],
         ["Shorts","Ajoute le lien « vidéo associée » vers ta longue sur chaque Short."],
         ["Abonnés","Collab avec des créateurs de ta taille (5–20K) : ton public te découvre avec leur recommandation."]],
   prod:["Script complet avant tournage","Montage en 3 passes : assemblage, rythme, son + étalonnage"],
   fail:"Compare la courbe de cette vidéo avec celle de ton record : l'endroit où elle chute te dit quelle séquence n'a pas monté."},

   exploit:"250 € sur un mois (pub + membres)",
   stats:{vids:[33,6,27], longs:"380K", shorts:"1 M", subs:"6 000", eur:"250 €/mois"},
   skill:{name:"Toi à l'écran",
     why:"Les gens viennent pour un concept et restent pour une personne. Tu as peur de donner ton avis : c'est exactement ce qui fera la différence entre un spectateur et un fan.",
     ex:"Dans chaque vidéo, un moment face caméra où tu dis ce que tu penses vraiment, sans le scénariser. Style réel par défaut, cinématographique pour les 2–3 moments forts.",
     mes:"Des commentaires qui parlent de toi, pas seulement du concept. 20 membres."},
   grow:[["Vues","Un post Communauté 2 jours avant chaque vidéo : sondage, photo de tournage. Tes abonnés regardent dès la sortie."],
         ["Shorts","Republie tes Shorts sur TikTok et Instagram. Même travail, deux publics supplémentaires."],
         ["Abonnés","Making-of exclusif membres annoncé dans chaque vidéo et chaque live."]],
   prod:["Déléguer le montage des Shorts","1 vidéo complète pendant les vacances d'hiver"],
   fail:"Si les membres ne suivent pas, change ce qui est offert dans le club, pas le prix."},

   exploit:"150K vues + premier sponsor (300 €)",
   stats:{vids:[41,8,33], longs:"600K", shorts:"1,5 M", subs:"8 000", eur:"300 € sponsor"},
   skill:{name:"Le twist",
     why:"Une fin forte, c'est ce qui fait partager une vidéo. C'est aussi le cœur de ton ADN : le twist qui prouve que la limite était un mensonge.",
     ex:"Écris la fin en premier, avant tout le reste du script. Teste-la sur 2 personnes : si elles ne réagissent pas à voix haute, réécris.",
     mes:"Rétention au-dessus de 30 % sur la dernière minute. Clics sur l'écran de fin."},
   grow:[["Vues","À partir de 8K, propose ton histoire aux médias (Le Parisien, Konbini…) quand le concept a un vrai angle réel."],
         ["Shorts","Un Short teaser 48 h avant la grosse vidéo, avec le moment le plus fou sans la fin."],

   prod:["Vacances de printemps entièrement pour cette vidéo","Site pour les marques envoyé à 15 marques dès la sortie"],
   fail:"Démarche quand même les marques avec ta meilleure vidéo et ta croissance depuis octobre."},

   skill:{name:"La profondeur",
     why:"Une vidéo qui pose une vraie question et y répond par ce que tu vis, on la partage et on s'en souvient. C'est ta couche Fond.",
     ex:"Pose une question au début (ex. « qu'est-ce qui nous empêche de partir ? »). Ne donne jamais la réponse avec des mots : ce que tu vis doit y répondre. Morale en une phrase, à la fin.",
     mes:"Partages et abonnés gagnés pour 1 000 vues en hausse vs tes vidéos précédentes."},
   grow:[["Vues","Analyse tes 9 longues : garde le type de concept, la durée et le style de miniature qui ont le mieux marché."],
         ["Shorts","Réponds aux meilleurs commentaires en Short (fonction Répondre avec un Short)."],
         ["Abonnés","Une série courte cet été (2–3 vidéos liées) : le spectateur s'abonne pour ne pas rater la suite."]],
   prod:["Les 3 scripts de l'été écrits avant la fin des cours","Le dossier chiffré présenté à tes parents"],
   fail:"Présente quand même la courbe. Une progression régulière depuis octobre reste un argument solide."},
  {hex:"#1f7fd1", ph:3, name:"Vivre de YouTube", goal:"1 000 €/mois", date:"2027-08-31",
   exploit:"1 000 € en juillet ET en août",
   stats:{vids:[67,12,55], longs:"1,5 M", shorts:"3 M", subs:"16 000", eur:"1 000 €/mois"},
   skill:{name:"Le son",
     why:"Le son fait la moitié de l'émotion. C'est la compétence qui fait passer une bonne vidéo à une vidéo qui marque, et l'été te donne le temps de la travailler.",
     ex:"Une passe de montage rien que pour le son : ambiances, silences avant les moments forts, musique qui monte avec l'escalade. Coupe la musique au moment le plus intense.",

   grow:[["Vues","Une vidéo toutes les 3 semaines tout l'été : la régularité entretient la recommandation."],

var KEY = "loan-7lvl-v7";
var state = {};
try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {} }
function won(i) { return !!state[i]; }
function cur() {
  for (var k = 0; k < LV.length; k++) { if (!won(k)) return k; }
  return LV.length - 1;
}
function fmt(d) {
  return new Date(d + "T12:00:00").toLocaleDateString("fr-FR", {day:"numeric", month:"short", year:"numeric"});
}
function hexRgba(hex, a) {
  var r = parseInt(hex.slice(1,3),16);
  var g = parseInt(hex.slice(3,5),16);
  var b = parseInt(hex.slice(5,7),16);
  return "rgba("+r+","+g+","+b+","+a+")";
}
function darken(hex, f) {
  var r = Math.round(parseInt(hex.slice(1,3),16)*f);
  var g = Math.round(parseInt(hex.slice(3,5),16)*f);
  var b = Math.round(parseInt(hex.slice(5,7),16)*f);
  return "rgb("+r+","+g+","+b+")";
}

var sel = cur();

function setAccent(el, L) {
  el.style.setProperty("--accent", L.hex);
  el.style.setProperty("--accent-tint", hexRgba(L.hex, 0.09));
  el.style.setProperty("--accent-border", hexRgba(L.hex, 0.28));
}

function renderNav() {
  var c = cur();
  var html = "";
  for (var i = 0; i < LV.length; i++) {
    var L = LV[i];
    var isWon = won(i);
    var isCur = (i === c && !isWon);
    var isLocked = (!isWon && i > c);
    var bg = isWon ? darken(L.hex, 0.55) : (isLocked ? darken(L.hex, 0.22) : L.hex);
    var cls = "lb" + (i === sel ? " active" : "") + (isLocked ? " locked" : "");
    html += '<button class="'+cls+'" data-i="'+i+'" style="background:'+bg+'" aria-label="Level '+(i+1)+' : '+L.name+'">';
    if (isCur) html += '<div class="lb-cur">En cours</div>';
    html += '<div class="lb-num">'+(i+1)+'</div>';
    html += '<div class="lb-label">LEVEL</div>';
    if (isWon) html += '<div class="lb-ck">✓</div>';
    html += '</button>';
  }
  document.getElementById("lnav").innerHTML = html;
}

function renderContent() {
  var L = LV[sel];
  var i = sel;
  var s = L.stats;
  var days = Math.ceil((new Date(L.date + "T23:59:59") - new Date()) / 864e5);
  var cdTxt = days > 0 ? days : 0;
  var cdLabel = days > 0 ? ("jour"+(days>1?"s":"")+" restants") : "Date passée";
  var w = won(i);

  var el = document.getElementById("content");
  setAccent(el, L);

  var html = '';
  html += '<div class="lv-hero">';
  html += '<div class="lv-bignum">'+(i+1)+'</div>';
  html += '<div class="lv-ht">';
  html += '<div class="lv-tag">Level '+(i+1)+' · avant le '+fmt(L.date)+'</div>';
  html += '<div class="lv-title">'+L.exploit+'</div>';
  html += '<div class="lv-sub">'+L.name+' · '+L.goal+'</div>';
  if (w) html += '<div class="lv-won-badge">✓ Level validé</div>';
  html += '</div></div>';

  html += '<div class="ph-note">'+PH[L.ph]+'</div>';

  html += '<div class="stats">';
  html += '<div class="stat"><div class="stat-v">'+s.vids[0]+'</div><div class="stat-l">Vidéos postées</div><div class="stat-s">'+s.vids[1]+' longues · '+s.vids[2]+' Shorts</div></div>';
  html += '<div class="stat"><div class="stat-v">'+s.longs+'</div><div class="stat-l">Vues longues</div></div>';
  html += '<div class="stat"><div class="stat-v">'+s.shorts+'</div><div class="stat-l">Vues Shorts</div></div>';
  html += '<div class="stat"><div class="stat-v">'+s.subs+'</div><div class="stat-l">Abonnés</div></div>';
  html += '<div class="stat"><div class="stat-v">'+s.eur+'</div><div class="stat-l">Revenus</div></div>';
  html += '</div>';

  html += '<div class="mgrid">';
  html += '<div class="skill">';
  html += '<div class="skill-ey">Compétence à débloquer</div>';
  html += '<div class="skill-name">'+L.skill.name+'</div>';
  html += '<div class="skill-row"><div class="skill-dt">Pourquoi maintenant</div><div class="skill-dd">'+L.skill.why+'</div></div>';
  html += '<div class="skill-row"><div class="skill-dt">L\'exercice</div><div class="skill-dd">'+L.skill.ex+'</div></div>';
  html += '<div class="skill-mes">'+L.skill.mes+'</div>';
  html += '</div>';

  html += '<div class="rcol">';
  html += '<div class="box"><div class="box-h">Temps restant</div><div class="cd-n">'+cdTxt+'</div><div class="cd-u">'+cdLabel+'</div><div class="cd-d">Deadline : '+fmt(L.date)+'</div></div>';
  html += '<div class="box"><div class="box-h">Pour grossir · à ta taille</div><ul class="grow">';
  for (var g = 0; g < L.grow.length; g++) {
    html += '<li class="gi"><span class="gi-k">'+L.grow[g][0]+'</span><span class="gi-v">'+L.grow[g][1]+'</span></li>';
  }
  html += '</ul></div>';
  html += '<div class="box"><div class="box-h">Production</div><ul class="prod-list">';
  for (var p = 0; p < L.prod.length; p++) {
    html += '<li class="prod-item">'+L.prod[p]+'</li>';
  }
  html += '</ul></div>';
  html += '<div class="box"><div class="box-h">Si tu rates la date</div><p class="fail-p">'+L.fail+'</p></div>';
  html += '<button class="win '+(w?'done':'todo')+'" id="win">'+(w?'Level validé ✓':"J'ai réussi ce level")+'</button>';
  html += '</div></div>';

  el.innerHTML = html;

  document.getElementById("win").addEventListener("click", function() {
    state[i] = !won(i);
    save();
    var btn = document.getElementById("win");
    btn.classList.add("popping");
    btn.addEventListener("animationend", function(){ btn.classList.remove("popping"); }, {once:true});
    renderNav();
    renderContent();
  });
}

function selectLevel(idx) {
  if (idx === sel) return;
  sel = idx;
  var el = document.getElementById("content");
  el.classList.add("fading");
  setTimeout(function() {
    el.classList.remove("fading");
    el.scrollTop = 0;
    renderNav();
    renderContent();
  }, 110);
}

document.getElementById("lnav").addEventListener("click", function(e) {
  var b = e.target;
  while (b && b.dataset.i === undefined) b = b.parentElement;
  if (!b || b.dataset.i === undefined) return;
  selectLevel(parseInt(b.dataset.i, 10));
});

renderNav();
renderContent();
</script>
</body>
</html>
